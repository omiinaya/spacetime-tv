services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: stv-backend
    expose:
      - "8720"
    env_file:
      - path: ./server/.env
        required: false
    volumes:
      - ./web/dist:/app/web/dist
      # Bind-mount the server data dir (NOT the epg_cache.json file itself):
      # Docker auto-creates missing bind-mount paths as DIRECTORIES, so
      # mounting a file that's gitignored (epg_cache.json) made a fresh clone
      # create a directory at that path -> first EPG write raised
      # IsADirectoryError. The data dir is safe (mkdir -p semantics) and the
      # app persists epg_cache.json + profiles + providers inside it.
      - ./server/data:/app/data
    environment:
      - EPG_CACHE_FILE=/app/data/epg_cache.json
      - STV_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8720/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: stv-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - ACME_DOMAIN=${ACME_DOMAIN:-}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - ACME_STAGING=${ACME_STAGING:-false}
    volumes:
      - stv-certificates:/etc/letsencrypt
    restart: unless-stopped

volumes:
  stv-certificates:

networks:
  default:
    name: stv-network
