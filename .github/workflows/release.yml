# NOTE: this file was renamed from e2e.yml → release.yml (2026-07-31).
# It was misnamed — it is the container release-build workflow and never
# ran Playwright. The Playwright E2E specs in web/e2e/ are NOT wired into
# CI because they require a live backend with IPTV credentials (see README
# "E2E tests" section for the rationale).
name: Release Build

on:
  push:
    branches: [master, 'release/*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: [self-hosted, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (system, job-local venv)
        run: |
          PY=$(command -v python3.11 || command -v python3)
          "$PY" -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
          python --version

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (Python)
        working-directory: server
        run: ruff check .

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: no `cache: npm` — the Actions cache upload hangs on the
          # self-hosted LXC network (see self-hosted-github-runners skill #15).

      - name: Install npm dependencies
        working-directory: ./web
        run: npm ci

      - name: ESLint (TypeScript)
        working-directory: ./web
        run: npm run lint

  build:
    runs-on: [self-hosted, ubuntu-latest]
    needs: lint
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./server
            dockerfile: ./server/Dockerfile
          - service: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
