# Release Build — lint gate on every master push; container images only on
# explicit release tags (this box deploys natively via systemd, NOT Docker —
# the docker/setup-buildx-action cannot provision buildx inside this LXC, and
# there is no production GHCR consumer for these images).
name: Release Build

on:
  push:
    branches: [master, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (Python)
        working-directory: server
        run: ruff check .

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: no `cache: npm` — keep CI minimal on hosted runners.

      - name: Install npm dependencies
        working-directory: ./web
        run: npm ci

      - name: ESLint (TypeScript)
        working-directory: ./web
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    # Only build+push container images on version tags (explicit releases).
    # Every-master-push image publishing previously made master permanently
    # red here: setup-buildx-action cannot provision buildx in this LXC.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./server
            dockerfile: ./server/Dockerfile
          - service: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
