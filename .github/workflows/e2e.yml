name: E2E Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IPTV_BASE: ${{ secrets.IPTV_BASE || 'http://iptv-provider.example.com' }}
  IPTV_USER: ${{ secrets.IPTV_USER }}
  IPTV_PASS: ${{ secrets.IPTV_PASS }}
  E2E_BASE_URL: http://127.0.0.1:5183

jobs:
  e2e:
    if: ${{ env.IPTV_USER != '' && env.IPTV_PASS != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend deps
        working-directory: server
        run: |
          pip install -r requirements.txt

      - name: Start backend
        working-directory: server
        env:
          CACHE_WARM_ENABLED: "false"
          CACHE_WARM_CATEGORIES: ""
          CLEANUP_INTERVAL: "3600"
          CACHE_TTL_HOURS: "0"
        run: |
          python main.py &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8720/api/health > /dev/null 2>&1; then
              echo "Backend ready (attempt $i)"
              break
            fi
            sleep 1
          done

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Serve frontend
        working-directory: web
        run: |
          npx vite preview --port 5183 --host 127.0.0.1 &
          for i in {1..15}; do
            if curl -s http://127.0.0.1:5183 > /dev/null 2>&1; then
              echo "Frontend ready (attempt $i)"
              break
            fi
            sleep 1
          done

      - name: Install Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 3
