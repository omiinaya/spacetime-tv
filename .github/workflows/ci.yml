name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches-ignore: [master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint (Python)
        working-directory: server
        run: ruff check .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend deps
        working-directory: server
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        working-directory: server
        run: python -m pytest tests/ -v --ignore=tests/test_live.py --ignore=tests/test_streaming_e2e.py --ignore=tests/test_integration_iptv.py -x --timeout=60

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: web
        run: npm test

      - name: TypeScript type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web
        run: npm run build
