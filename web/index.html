<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Spacetime-TV</title>
    <!-- Inline @font-face for Inter — immediate font discovery (prevents CLS on text render) -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa25L7SUc.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spacetime-TV" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Inline critical CSS — design tokens, base reset + initial layout (prevents FOUC/CLS before full CSS loads) -->
    <style>
      /* ── Design tokens (dark mode default) ── */
      :root {
        --color-background: oklch(0.09 0.004 285.823);
        --color-foreground: oklch(0.97 0 0);
        --color-card: oklch(0.13 0.005 285.885);
        --color-primary: oklch(0.62 0.19 262.881);
        --color-secondary: oklch(0.18 0.006 286.033);
        --color-muted: oklch(0.15 0.005 286.033);
        --color-muted-foreground: oklch(0.6 0.015 286.067);
        --color-border: oklch(0.18 0.005 286.033);
        --color-sidebar: oklch(0.07 0.003 285.823);
        --color-destructive: oklch(0.55 0.21 21.519);
        --font-family-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --radius: 0.5rem;
      }

      /* ── Light mode ── */
      .light {
        --color-background: oklch(0.97 0 0);
        --color-foreground: oklch(0.09 0.004 285.823);
        --color-card: oklch(0.93 0.005 285.885);
        --color-primary: oklch(0.55 0.19 262.881);
        --color-secondary: oklch(0.88 0.006 286.033);
        --color-muted: oklch(0.9 0.005 286.033);
        --color-muted-foreground: oklch(0.4 0.015 286.067);
        --color-border: oklch(0.82 0.005 286.033);
        --color-sidebar: oklch(0.95 0.003 285.823);
        --color-destructive: oklch(0.52 0.21 21.519);
      }

      /* ── Base reset ── */
      *, *::before, *::after {
        box-sizing: border-box;
        border: 0 solid;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        line-height: 1.5;
        font-family: var(--font-family-sans);
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        scrollbar-gutter: stable;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-foreground);
        overflow-x: hidden;
        touch-action: manipulation;
        min-height: 100vh;
        overscroll-behavior: contain;
      }
      * { border-color: var(--color-border); }
      #root { min-height: 100vh; }

      /* ── Critical utility classes (prevent CLS before full CSS) ── */
      .bg-background { background-color: var(--color-background); }
      .text-foreground { color: var(--color-foreground); }

      /* ── Tailwind layout utilities for initial shell render (prevents CLS) ── */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1 1 0%; }
      .h-screen { height: 100vh; }
      .h-full { height: 100%; }
      .overflow-hidden { overflow: hidden; }
      .overflow-y-auto { overflow-y: auto; }
      .hidden { display: none; }
      .shrink-0 { flex-shrink: 0; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .min-h-\[60vh\] { min-height: 60vh; }
      .fixed { position: fixed; }
      .absolute { position: absolute; }
      .relative { position: relative; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .w-64 { width: 16rem; }
      .z-30 { z-index: 30; }
      .z-50 { z-index: 50; }
      .border-r { border-right-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-t { border-top-width: 1px; }
      .bg-black\/50 { background-color: rgb(0 0 0 / 0.5); }

      @media (min-width: 768px) {
        .md\:block { display: block; }
        .md\:hidden { display: none; }
      }

      /* ── Scrollbar (prevents scrollbar reflow) ── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-muted); border-radius: 3px; }

      /* ── Sizing utilities for initial shell (prevents CLS) ── */
      .h-4 { height: 1rem; }
      .h-5 { height: 1.25rem; }
      .h-8 { height: 2rem; }
      .h-12 { height: 3rem; }
      .h-14 { height: 3.5rem; }
      .w-4 { width: 1rem; }
      .w-5 { width: 1.25rem; }
      .w-6 { width: 1.5rem; }
      .w-8 { width: 2rem; }
      .w-full { width: 100%; }

      /* ── Spacing utilities for initial shell ── */
      .gap-2 { gap: 0.5rem; }
      .gap-2\.5 { gap: 0.625rem; }
      .gap-3 { gap: 0.75rem; }
      .space-y-0\.5 > * + * { margin-top: 0.125rem; }
      .p-4 { padding: 1rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }

      /* ── Typography utilities for initial shell ── */
      .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
      .text-xs { font-size: 0.75rem; line-height: 1rem; }
      .font-semibold { font-weight: 600; }
      .text-left { text-align: left; }

      /* ── Border utilities for initial shell ── */
      .border-l-2 { border-left-width: 2px; }
      .rounded-lg { border-radius: 0.5rem; }
      .rounded-md { border-radius: 0.375rem; }
      .rounded-full { border-radius: 9999px; }
      .border-2 { border-width: 2px; }
      .border-blue-500 { border-color: rgb(59 130 246); }
      .border-t-transparent { border-top-color: transparent; }

      /* ── Responsive padding ── */
      @media (min-width: 768px) {
        .md\:p-6 { padding: 1.5rem; }
      }
      @media (min-width: 1024px) {
        .lg\:p-8 { padding: 2rem; }
      }

      /* ── Animations ── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .fade-in { animation: fade-in 200ms both; }
    </style>
    <!-- Preconnect + preload for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Async Google Fonts CSS -- deferred, @font-face already inlined above -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
