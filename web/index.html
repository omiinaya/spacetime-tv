<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Spacetime-TV</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spacetime-TV" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Inline critical CSS — prevents FOUC/CLS before full CSS loads -->
    <style>
      /* ── Design tokens (dark mode default) ── */
      :root {
        --color-background: oklch(0.09 0.004 285.823);
        --color-foreground: oklch(0.97 0 0);
        --color-card: oklch(0.13 0.005 285.885);
        --color-primary: oklch(0.62 0.19 262.881);
        --color-secondary: oklch(0.18 0.006 286.033);
        --color-muted: oklch(0.15 0.005 286.033);
        --color-muted-foreground: oklch(0.6 0.015 286.067);
        --color-border: oklch(0.18 0.005 286.033);
        --color-sidebar: oklch(0.07 0.003 285.823);
        --color-destructive: oklch(0.55 0.21 21.519);
        --font-family-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --radius: 0.5rem;
      }

      /* ── Light mode ── */
      .light {
        --color-background: oklch(0.97 0 0);
        --color-foreground: oklch(0.09 0.004 285.823);
        --color-card: oklch(0.93 0.005 285.885);
        --color-primary: oklch(0.55 0.19 262.881);
        --color-secondary: oklch(0.88 0.006 286.033);
        --color-muted: oklch(0.9 0.005 286.033);
        --color-muted-foreground: oklch(0.4 0.015 286.067);
        --color-border: oklch(0.82 0.005 286.033);
        --color-sidebar: oklch(0.95 0.003 285.823);
        --color-destructive: oklch(0.52 0.21 21.519);
      }

      /* ── Base reset ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border: 0 solid;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        line-height: 1.5;
        font-family: var(--font-family-sans);
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-foreground);
        overflow-x: hidden;
        touch-action: manipulation;
        min-height: 100vh;
      }
      * {
        border-color: var(--color-border);
      }
      #root {
        min-height: 100vh;
      }

      /* ── Initial layout — prevents CLS as React mounts ── */
      .initial-layout {
        display: flex;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      /* ── Scrollbar (prevents scrollbar reflow) ── */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-muted);
        border-radius: 3px;
      }

      /* ── Critical layout utilities (prevents CLS before full Tailwind CSS loads) ── */
      .flex { display: flex; }
      .flex-1 { flex: 1 1 0%; }
      .flex-col { flex-direction: column; }
      .shrink-0 { flex-shrink: 0; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .gap-2 { gap: 0.5rem; }
      .gap-2\.5 { gap: 0.625rem; }
      .gap-3 { gap: 0.75rem; }
      .space-y-0\.5 > * + * { margin-top: 0.125rem; }

      /* Sizing */
      .h-screen { height: 100vh; }
      .h-full { height: 100%; }
      .h-8 { height: 2rem; }
      .h-12 { height: 3rem; }
      .h-14 { height: 3.5rem; }
      .w-8 { width: 2rem; }
      .w-64 { width: 16rem; }
      .w-\[5px\] { width: 5px; }
      .min-h-\[60vh\] { min-height: 60vh; }
      .min-h-screen { min-height: 100vh; }

      /* Overflow */
      .overflow-hidden { overflow: hidden; }
      .overflow-y-auto { overflow-y: auto; }

      /* Display / visibility */
      .hidden { display: none; }
      @media (min-width: 768px) {
        .md\:block { display: block; }
        .md\:hidden { display: none; }
      }

      /* Position / z-index */
      .relative { position: relative; }
      .fixed { position: fixed; }
      .absolute { position: absolute; }
      .inset-0 { inset: 0; }
      .z-30 { z-index: 30; }
      .z-50 { z-index: 50; }

      /* Typography */
      .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
      .text-\[10px\] { font-size: 10px; }
      .font-semibold { font-weight: 600; }
      .text-left { text-align: left; }
      .text-center { text-align: center; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0;
        margin: -1px; overflow: hidden; clip: rect(0,0,0,0);
        white-space: nowrap; border-width: 0;
      }
      .focus\:not-sr-only:focus {
        position: static; width: auto; height: auto; padding: 0;
        margin: 0; overflow: visible; clip: auto; white-space: normal;
      }

      /* Padding / margin */
      .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
      .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .p-4 { padding: 1rem; }
      .pb-2 { padding-bottom: 0.5rem; }

      /* Borders & radius */
      .border-r { border-right-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-t { border-top-width: 1px; }
      .border-2 { border-width: 2px; }
      .border-l-2 { border-left-width: 2px; }
      .border-transparent { border-color: transparent; }
      .border-blue-500 { border-color: #3b82f6; }
      .border-t-transparent { border-top-color: transparent; }
      .rounded-full { border-radius: 9999px; }
      .rounded-md { border-radius: 0.375rem; }
      .rounded-lg { border-radius: 0.5rem; }

      /* Colors (background & text) */
      .bg-sidebar { background-color: var(--color-sidebar); }
      .bg-primary { background-color: var(--color-primary); }
      .bg-primary\/10 { background-color: color-mix(in oklch, var(--color-primary) 10%, transparent); }
      .bg-primary\/20 { background-color: color-mix(in oklch, var(--color-primary) 20%, transparent); }
      .bg-primary\/30 { background-color: color-mix(in oklch, var(--color-primary) 30%, transparent); }
      .bg-muted { background-color: var(--color-muted); }
      .bg-black\/50 { background-color: rgba(0, 0, 0, 0.5); }
      .bg-gradient-to-br { background-image: linear-gradient(to bottom right, var(--tw-gradient-stops)); }
      .from-primary { --tw-gradient-from: var(--color-primary); --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, oklch(0.37 0 0)); }
      .to-purple-600 { --tw-gradient-to: #9333ea; }
      .text-foreground { color: var(--color-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .text-white { color: #fff; }
      .text-primary-foreground { color: var(--color-foreground); }
      .text-muted-foreground\/50 { color: color-mix(in oklch, var(--color-muted-foreground) 50%, transparent); }
      .text-muted-foreground\/30 { color: color-mix(in oklch, var(--color-muted-foreground) 30%, transparent); }
      .antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      .hover\:text-foreground:hover { color: var(--color-foreground); }
      .hover\:text-muted-foreground\/60:hover { color: color-mix(in oklch, var(--color-muted-foreground) 60%, transparent); }
      .hover\:bg-muted:hover { background-color: var(--color-muted); }
      .hover\:bg-primary\/20:hover { background-color: color-mix(in oklch, var(--color-primary) 20%, transparent); }
      .active\:bg-primary\/30:active { background-color: color-mix(in oklch, var(--color-primary) 30%, transparent); }

      /* Cursor */
      .cursor-ew-resize { cursor: ew-resize; }

      /* ── Spinner (for Suspense fallback loader) ── */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }

      /* ── Hover effects on channel cards (fade in) ── */
      .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
    </style>
    <!-- Preconnect + preload for critical Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet" />
    </noscript>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
