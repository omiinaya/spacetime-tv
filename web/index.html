<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>Spacetime-TV</title>
    <!-- Inline @font-face for Inter — immediate font discovery (prevents CLS on text render) -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa25L7SUc.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spacetime-TV" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Inline critical CSS — design tokens, base reset + initial layout (prevents FOUC/CLS before full CSS loads) -->
    <style>
      /* ── Design tokens (dark mode default) ── */
      :root {
        --color-background: oklch(0.09 0.004 285.823);
        --color-foreground: oklch(0.97 0 0);
        --color-card: oklch(0.13 0.005 285.885);
        --color-primary: oklch(0.62 0.19 262.881);
        --color-secondary: oklch(0.18 0.006 286.033);
        --color-muted: oklch(0.15 0.005 286.033);
        --color-muted-foreground: oklch(0.6 0.015 286.067);
        --color-border: oklch(0.18 0.005 286.033);
        --color-sidebar: oklch(0.07 0.003 285.823);
        --color-destructive: oklch(0.55 0.21 21.519);
        --font-family-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --radius: 0.5rem;
      }

      /* ── Light mode ── */
      .light {
        --color-background: oklch(0.97 0 0);
        --color-foreground: oklch(0.09 0.004 285.823);
        --color-card: oklch(0.93 0.005 285.885);
        --color-primary: oklch(0.55 0.19 262.881);
        --color-secondary: oklch(0.88 0.006 286.033);
        --color-muted: oklch(0.9 0.005 286.033);
        --color-muted-foreground: oklch(0.4 0.015 286.067);
        --color-border: oklch(0.82 0.005 286.033);
        --color-sidebar: oklch(0.95 0.003 285.823);
        --color-destructive: oklch(0.52 0.21 21.519);
      }

      /* ── Base reset ── */
      *, *::before, *::after {
        box-sizing: border-box;
        border: 0 solid;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        line-height: 1.5;
        font-family: var(--font-family-sans);
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        scrollbar-gutter: stable;
      }
      body {
        background-color: var(--color-background);
        color: var(--color-foreground);
        overflow-x: hidden;
        touch-action: manipulation;
        min-height: 100vh;
        overscroll-behavior: contain;
        overflow-wrap: break-word;
      }
      * { border-color: var(--color-border); }
      #root { min-height: 100vh; }

      /* ── Animations ── */
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .fade-in { animation: fade-in 200ms both; }
    </style>
    
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
