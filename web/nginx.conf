server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version from Server header — prevent version-specific exploit targeting
    server_tokens off;

    # ── Security Headers ──────────────────────────────────────────────────
    # Match the backend SecurityHeadersMiddleware in server/main.py
    #
    # NOTE: nginx locations that use their own `add_header` directive do NOT
    # inherit server-level add_header directives. For locations that need
    # custom Cache-Control (assets, SPA root, API), use `expires` instead
    # — it does NOT break add_header inheritance.

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Limit referrer leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — allow inline styles/scripts (React hydration),
    # self for assets, blob/data for media streams (HLS/mpegts), TMDB/TMDB
    # image CDN for poster images, photo-tmdb.com for channel icons.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://*.tmdb.org http://photo-tmdb.com https://photo-tmdb.com; media-src 'self' blob: data: https: http:; font-src 'self' data:; connect-src 'self' https: http:; frame-src 'none'; object-src 'none'; base-uri 'self'" always;

    # HSTS — force HTTPS (production only; harmless here since served behind proxy)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Permissions Policy — restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Cross-Origin-Resource-Policy — prevent cross-origin data leakage
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Cross-Origin-Opener-Policy — isolate cross-origin windows
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # X-XSS-Protection — legacy browser XSS filter (deprecated but still useful)
    add_header X-XSS-Protection "1; mode=block" always;

    # X-Permitted-Cross-Domain-Policies — prevent Flash/PDF cross-domain access
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Cross-Origin-Embedder-Policy — enable cross-origin isolation (paired with COOP)
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Cache-Control: no-transform — prevent intermediaries from modifying content
    add_header Cache-Control "no-transform" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── Static assets (content-hashed filenames) ──────────────────────────
    location /assets/ {
        expires 1y;
    }

    # ── API proxy to backend ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8720;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s; # long-lived streams
    }

    # ── SPA fallback: serve index.html for all non-file routes ────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny access to hidden files ───────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
